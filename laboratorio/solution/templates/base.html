<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <title>{% block title %}My Cool Social Network{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>

<body>
    <header id="myheader">
        <nav class="navbar navbar-dark navbar-expand-lg mynavbar">
            <div class="container-fluid">
                <h1 class="display-5">My Cool Social Network</h1>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{{ url_for('home') }}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('about') }}">About us</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <div class="container-fluid mt-4">
        <div class="row">
            <!--aside-->
            <aside id="myaside" class="col-lg-2 col-md-12">
                {% block aside %}
                {% endblock %}
            </aside>
            <!--maincontent-->
            <main class="col-lg-9 col-md-12">
                {% block content %}{% endblock %}
            </main>

            <button type="button" class="mybutton" data-bs-toggle="modal" data-bs-target="#createModal">
                +
            </button>
            <div class="modal fade" id="createModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5">Create a new post</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form action="/posts/new" method="POST" enctype="multipart/form-data">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="usrnameSelect" class="form-label">Username</label>
                                    <select class="form-select" aria-label="Tell me who you are" id="usrnameSelect"
                                        name="usrname">
                                        {% for user in users %}
                                        <option value="{{user}}">{{user}}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="postTextArea" class="form-label">What’s on your mind?</label>
                                    <textarea class="form-control" id="postTextArea" name="post" rows="3"
                                        placeholder="Enter text for your post" required minlength="30"
                                        maxlength="200"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="imageFile" class="form-label">Add an image, if you want</label>
                                    <input class="form-control" name="image" type="file" id="imageFile">
                                </div>
                                <div class="mb-3">
                                    <label for="dateTextInput" class="form-label">Select a date</label>
                                    <input class="form-control" type="date" name="date" id="dateTextInput" required>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Create Post</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
